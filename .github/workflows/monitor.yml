name: Monitor panipuri.cfd

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions minimum supported interval is 5 minutes.
    # 10 minutes leaves margin for Spaceship's per-domain API rate limit.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  check-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability and notify
        env:
          DOMAIN: panipuri.cfd
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_SENT: ${{ vars.DOMAIN_ALERT_SENT }}
        run: python monitor.py
